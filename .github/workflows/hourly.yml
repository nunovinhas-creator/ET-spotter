name: Hourly Monitor

on:
  schedule:
    - cron: "0 * * * *"   # cada hora a X:00 UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch intraday data
        run: python scripts/fetch_intraday.py

      - name: Compute metrics
        run: python scripts/compute_metrics.py

      - name: Compute scores
        run: python scripts/compute_score.py

      - name: Commit updated data
        run: |
          git config --global user.name "et-spotter-bot"
          git config --global user.email "bot@et-spotter"
          git add data/
          git diff --cached --quiet || git commit -m "chore: hourly data update $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
