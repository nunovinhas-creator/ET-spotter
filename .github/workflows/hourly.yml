name: Hourly Monitor

on:
  schedule:
    - cron: "0 13-22 * * 1-5"   # seg-sex 13h-22h UTC (janela US+EU market hours)
  workflow_dispatch:

concurrency:
  group: et-spotter-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch intraday data
        run: python scripts/fetch_intraday.py

      - name: Compute metrics
        run: python scripts/compute_metrics.py

      - name: Compute scores
        run: python scripts/compute_score.py

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: false
          commit_message: "chore: dashboard ${{ github.run_id }}"

      - name: Commit updated data
        run: |
          git config --global user.name "et-spotter-bot"
          git config --global user.email "bot@et-spotter.local"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: hourly data update $(date -u '+%Y-%m-%d %H:%M') UTC"
          attempts=0
          until git push; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 5 ]; then
              echo "Push falhou após $attempts tentativas" && exit 1
            fi
            echo "Push falhou (tentativa $attempts/5), aguardando $((2 ** attempts))s..."
            sleep $((2 ** attempts))
            git pull --rebase origin ${{ github.ref_name }}
          done
