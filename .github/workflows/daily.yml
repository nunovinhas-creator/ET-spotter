name: Daily Report

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC — após fecho do mercado US (21:00 UTC), dados EOD fiáveis
  workflow_dispatch:

concurrency:
  group: et-spotter-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch intraday data
        run: python scripts/fetch_intraday.py

      - name: Fetch daily data
        run: python scripts/fetch_daily.py

      - name: Compute metrics
        run: python scripts/compute_metrics.py

      - name: Compute scores
        run: python scripts/compute_score.py

      - name: Generate charts
        run: python scripts/generate_charts.py

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: false
          commit_message: "chore: dashboard ${{ github.run_id }}"

      - name: Send daily report
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python scripts/daily_report.py

      - name: Commit report artifacts
        run: |
          git config --global user.name "et-spotter-bot"
          git config --global user.email "bot@et-spotter"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: daily report $(date -u '+%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }}
          attempts=0
          until git push; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 5 ]; then
              echo "Push falhou após $attempts tentativas" && exit 1
            fi
            echo "Push falhou (tentativa $attempts/5), aguardando $((2 ** attempts))s..."
            sleep $((2 ** attempts))
          done
