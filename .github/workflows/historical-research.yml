name: Historical ETF Research (isolated)

on:
  pull_request:
    paths:
      - "scripts/historical_research.py"
      - "tests/test_historical_research.py"
      - ".github/workflows/historical-research.yml"
  workflow_dispatch:
    inputs:
      start:
        description: "Data de inicio de comparacao (YYYY-MM-DD)"
        default: "2020-01-01"
        required: true
        type: string
      cost_side_bps:
        description: "Comissao + spread + slippage por lado (bps)"
        default: "15"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            config
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies for offline checks
        run: python -m pip install "numpy>=1.24,<2" "pandas>=2,<3"
      - name: Syntax
        run: python -m py_compile scripts/historical_research.py tests/test_historical_research.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -p "test_historical_research.py" -v

  replay_repo_data:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            config
            data/daily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline data replay (available repository window only)
        run: |
          python -m pip install "numpy>=1.24,<2" "pandas>=2,<3"
          python scripts/historical_research.py \
            --prices-dir data/daily \
            --start 2025-01-01 \
            --end "$(date -u +%F)" \
            --output research_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-window-v3-research
          path: research_results/
          if-no-files-found: warn
          retention-days: 14

  historical:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            config
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install "numpy>=1.24,<2" "pandas>=2,<3" "yfinance>=0.2.40,<0.3"
      - name: Reconstruct historical V3 signals (NOT original 60/40 ensemble)
        env:
          START_DATE: ${{ inputs.start }}
          SIDE_BPS: ${{ inputs.cost_side_bps }}
        run: |
          python scripts/historical_research.py \
            --download-from 2013-01-01 \
            --start "$START_DATE" \
            --end "$(date -u +%F)" \
            --cost-side-bps "$SIDE_BPS" \
            --output research_results
      - name: Publish isolated reproducible research (never to dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-v3-research
          path: research_results/
          if-no-files-found: warn
          retention-days: 14
