name: Alert Monitor

on:
  schedule:
    - cron: "15 * * * *"   # 15 minutos depois do hourly, já com dados atualizados
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect and send alerts
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        # exit 1 do script quando há alertas é esperado – não falha o workflow
        run: python scripts/detect_alerts.py || true
