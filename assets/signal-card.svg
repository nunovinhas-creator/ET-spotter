<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 168" width="900" height="168">
  <defs>
    <linearGradient id="sc_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="sc_line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c83fd" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#4caf50" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#7c83fd" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#ffd54f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c83fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow_green"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow_yellow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background + outer border -->
  <rect width="900" height="168" rx="5" fill="url(#sc_bg)" stroke="#1e2130" stroke-width="1"/>

  <!-- Top accent gradient line -->
  <rect x="0" y="0" width="900" height="2" rx="1" fill="url(#sc_line)"/>

  <!-- Header title -->
  <text x="450" y="24"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#7c83fd" text-anchor="middle" letter-spacing="5" font-weight="600">
    ET-SPOTTER · SCORE v3 · NÍVEIS DE SINAL
  </text>

  <!-- Separator -->
  <line x1="30" y1="35" x2="870" y2="35" stroke="#1e2130" stroke-width="1"/>

  <!-- ── FORTE COMPRA (left: 0–300) ──────────────────── -->
  <rect x="0" y="35" width="300" height="133" fill="#051205"/>
  <!-- left accent bar -->
  <rect x="0" y="35" width="3" height="133" fill="#4caf50"/>

  <rect x="76" y="48" width="138" height="19" rx="2" fill="#4caf50"/>
  <text x="145" y="61"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#000" text-anchor="middle" font-weight="800" letter-spacing="2">
    FORTE COMPRA
  </text>

  <text x="150" y="97"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" fill="#4caf50" text-anchor="middle" font-weight="700" filter="url(#glow_green)">
    ≥ 0.75
  </text>

  <text x="150" y="117"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#4a7a4a" text-anchor="middle">
    Múltiplos indicadores alinhados
  </text>
  <text x="150" y="131"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#3a6a3a" text-anchor="middle">
    momentum forte · confluência máxima
  </text>
  <text x="150" y="151"
        font-family="monospace,Consolas,'Courier New',monospace"
        font-size="8" fill="#2d5c2d" text-anchor="middle" font-style="italic">
    percentil histórico P85+
  </text>

  <!-- ── Divider 1 ──────────────────── -->
  <line x1="300" y1="35" x2="300" y2="168" stroke="#1e2130" stroke-width="1"/>

  <!-- ── COMPRA (center: 300–600) ──────────────────── -->
  <rect x="300" y="35" width="300" height="133" fill="#040f04"/>
  <rect x="300" y="35" width="3" height="133" fill="#8bc34a"/>

  <rect x="378" y="48" width="84" height="19" rx="2" fill="#8bc34a"/>
  <text x="420" y="61"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#000" text-anchor="middle" font-weight="800" letter-spacing="2">
    COMPRA
  </text>

  <text x="450" y="97"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" fill="#8bc34a" text-anchor="middle" font-weight="700">
    ≥ 0.55
  </text>

  <text x="450" y="117"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#506640" text-anchor="middle">
    Maioria dos indicadores positivos
  </text>
  <text x="450" y="131"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#406030" text-anchor="middle">
    fase construtiva · tendência clara
  </text>
  <text x="450" y="151"
        font-family="monospace,Consolas,'Courier New',monospace"
        font-size="8" fill="#2d5020" text-anchor="middle" font-style="italic">
    percentil histórico P60+
  </text>

  <!-- ── Divider 2 ──────────────────── -->
  <line x1="600" y1="35" x2="600" y2="168" stroke="#1e2130" stroke-width="1"/>

  <!-- ── POTENCIAL (right: 600–900) ──────────────────── -->
  <rect x="600" y="35" width="300" height="133" fill="#15120000"/>
  <rect x="600" y="35" width="300" height="133" fill="#14120000" opacity="0"/>
  <!-- Using a different fill approach -->
  <rect x="600" y="35" width="300" height="133" fill="#141000"/>
  <rect x="600" y="35" width="3" height="133" fill="#ffd54f"/>

  <rect x="675" y="48" width="100" height="19" rx="2" fill="#ffd54f"/>
  <text x="725" y="61"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#000" text-anchor="middle" font-weight="800" letter-spacing="2">
    POTENCIAL
  </text>

  <text x="750" y="97"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" fill="#ffd54f" text-anchor="middle" font-weight="700" filter="url(#glow_yellow)">
    ≥ 0.40
  </text>

  <text x="750" y="117"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#7a7040" text-anchor="middle">
    Alguns sinais positivos
  </text>
  <text x="750" y="131"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" fill="#606030" text-anchor="middle">
    aguardar confirmação · fase de estudo
  </text>
  <text x="750" y="151"
        font-family="monospace,Consolas,'Courier New',monospace"
        font-size="8" fill="#504020" text-anchor="middle" font-style="italic">
    percentil histórico P35+
  </text>

  <!-- Bottom disclaimer -->
  <text x="450" y="163"
        font-family="monospace,Consolas,'Courier New',monospace"
        font-size="7" fill="#252525" text-anchor="middle" letter-spacing="1.5">
    ANÁLISE TÉCNICA BASEADA EM EVIDÊNCIA ACADÉMICA · NÃO CONSTITUI ACONSELHAMENTO FINANCEIRO
  </text>
</svg>
