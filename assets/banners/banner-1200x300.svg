<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>

    <!-- Top accent line gradient -->
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C83FD" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7C83FD" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#7C83FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C83FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom accent line gradient -->
    <linearGradient id="bottomLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4D9FFF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7C83FD" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="70%"  stop-color="#7C83FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4D9FFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Diagonal line gradient -->
    <linearGradient id="diagLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#00D4FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C83FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Top-left purple corner glow -->
    <radialGradient id="cornerGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="#7C83FD" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#7C83FD" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7C83FD" stop-opacity="0"/>
    </radialGradient>

    <!-- Center text glow -->
    <radialGradient id="textGlow" cx="38%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Vertical divider gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="80%"  stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Stat value gradient -->
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E8F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8BA4C8" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow filter for diagonal line -->
    <filter id="glowLine" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter for title -->
    <filter id="glowText" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stat glow filter -->
    <filter id="glowStat" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#4D9FFF" opacity="0.06"/>
    </pattern>

    <!-- Stat block surface -->
    <linearGradient id="statBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0F1629" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A0F1A" stop-opacity="0.9"/>
    </linearGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="300" fill="#0A0F1A"/>

  <!-- ── Dot-grid overlay ── -->
  <rect width="1200" height="300" fill="url(#dotGrid)"/>

  <!-- ── Top-left purple corner glow ── -->
  <rect width="500" height="280" fill="url(#cornerGlow)"/>

  <!-- ── Center radial text glow ── -->
  <ellipse cx="440" cy="148" rx="380" ry="140" fill="url(#textGlow)"/>

  <!-- ── Diagonal glow line ── -->
  <g filter="url(#glowLine)">
    <line x1="-10" y1="330" x2="820" y2="-20"
          stroke="url(#diagLineGrad)" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- ── Simplified wave line ── -->
  <path
    d="M0,158
       C50,153 100,143 150,148
       C200,153 250,168 300,162
       C350,156 400,143 450,149
       C500,155 550,169 600,163
       C650,157 700,143 750,149
       C800,155 850,169 900,163
       C950,157 1000,143 1050,149
       C1100,155 1150,167 1200,161"
    fill="none"
    stroke="#00D4FF"
    stroke-width="1"
    opacity="0.14"/>

  <!-- ── Top accent line ── -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#topLineGrad)"/>

  <!-- ── Bottom accent line ── -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#bottomLineGrad)"/>

  <!-- ── Left text block ── -->
  <!-- Title glow layer -->
  <text
    x="80" y="166"
    text-anchor="start"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-3"
    fill="#00D4FF"
    opacity="0.10"
    filter="url(#glowText)">ET-SPOTTER</text>

  <!-- Main title -->
  <text
    x="80" y="166"
    text-anchor="start"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-3"
    fill="#E8F0FF">ET-SPOTTER</text>

  <!-- Subtitle tagline -->
  <text
    x="80" y="196"
    text-anchor="start"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="6"
    fill="#7C83FD">QUANTITATIVE ETF ANALYSIS · AUTOMATED · OPEN SOURCE</text>

  <!-- Thin rule below subtitle -->
  <line x1="80" y1="212" x2="560" y2="212" stroke="#7C83FD" stroke-width="0.5" opacity="0.3"/>

  <!-- ── Vertical cyan divider ── -->
  <line x1="660" y1="48" x2="660" y2="252" stroke="url(#dividerGrad)" stroke-width="1"/>

  <!-- ── Right stats block ── -->
  <!-- Stat 1: 97 ETFs -->
  <g>
    <!-- Subtle stat box -->
    <rect x="700" y="88" width="130" height="68" rx="6" fill="url(#statBg)" stroke="#4D9FFF" stroke-width="0.5" stroke-opacity="0.15"/>
    <!-- Top micro-accent -->
    <rect x="700" y="88" width="130" height="1.5" rx="1" fill="#00D4FF" opacity="0.45"/>
    <!-- Value -->
    <text
      x="765" y="135"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="32"
      font-weight="800"
      letter-spacing="-1"
      fill="#E8F0FF"
      filter="url(#glowStat)">97</text>
    <!-- Label -->
    <text
      x="765" y="149"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="9"
      font-weight="500"
      letter-spacing="3"
      fill="#8BA4C8">ETFs UCITS</text>
  </g>

  <!-- Stat 2: 4 Factors -->
  <g>
    <rect x="848" y="88" width="130" height="68" rx="6" fill="url(#statBg)" stroke="#4D9FFF" stroke-width="0.5" stroke-opacity="0.15"/>
    <rect x="848" y="88" width="130" height="1.5" rx="1" fill="#7C83FD" opacity="0.55"/>
    <text
      x="913" y="135"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="32"
      font-weight="800"
      letter-spacing="-1"
      fill="#E8F0FF"
      filter="url(#glowStat)">4</text>
    <text
      x="913" y="149"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="9"
      font-weight="500"
      letter-spacing="3"
      fill="#8BA4C8">FACTORES</text>
  </g>

  <!-- Stat 3: 22h UTC -->
  <g>
    <rect x="996" y="88" width="130" height="68" rx="6" fill="url(#statBg)" stroke="#4D9FFF" stroke-width="0.5" stroke-opacity="0.15"/>
    <rect x="996" y="88" width="130" height="1.5" rx="1" fill="#00FF9D" opacity="0.45"/>
    <text
      x="1061" y="135"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="32"
      font-weight="800"
      letter-spacing="-1"
      fill="#E8F0FF"
      filter="url(#glowStat)">22h</text>
    <text
      x="1061" y="149"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="9"
      font-weight="500"
      letter-spacing="3"
      fill="#8BA4C8">UTC DAILY</text>
  </g>

  <!-- ── Bottom metadata strip ── -->
  <text
    x="600" y="282"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="2.5"
    fill="#1E3A5F">GITHUB ACTIONS · YFINANCE · PYTHON · MIT LICENSE</text>

</svg>
