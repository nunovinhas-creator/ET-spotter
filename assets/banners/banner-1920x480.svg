<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="480" viewBox="0 0 1920 480">
  <defs>

    <!-- Top accent line gradient -->
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C83FD" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7C83FD" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#7C83FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C83FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom accent line gradient -->
    <linearGradient id="bottomLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4D9FFF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7C83FD" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="70%"  stop-color="#7C83FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4D9FFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Diagonal line 1 gradient -->
    <linearGradient id="diagLine1Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#00D4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C83FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Diagonal line 2 gradient -->
    <linearGradient id="diagLine2Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C83FD" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4D9FFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Top-left purple corner glow radial -->
    <radialGradient id="cornerGlow" cx="0%" cy="0%" r="55%">
      <stop offset="0%"   stop-color="#7C83FD" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#7C83FD" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7C83FD" stop-opacity="0"/>
    </radialGradient>

    <!-- Center radial text glow -->
    <radialGradient id="textGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Bar chart gradient fill -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4D9FFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4D9FFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Glow filter for diagonal lines -->
    <filter id="glowLine" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter for title text -->
    <filter id="glowText" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#4D9FFF" opacity="0.06"/>
    </pattern>

    <!-- Right side grid pattern -->
    <pattern id="gridLines" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#4D9FFF" stroke-width="0.4" opacity="0.08"/>
    </pattern>

    <!-- Wave sine path clip -->
    <clipPath id="waveClip">
      <rect x="0" y="0" width="1920" height="480"/>
    </clipPath>

  </defs>

  <!-- ── Background ── -->
  <rect width="1920" height="480" fill="#0A0F1A"/>

  <!-- ── Dot-grid overlay ── -->
  <rect width="1920" height="480" fill="url(#dotGrid)"/>

  <!-- ── Top-left purple corner glow ── -->
  <rect width="700" height="400" fill="url(#cornerGlow)"/>

  <!-- ── Center radial text glow ── -->
  <ellipse cx="960" cy="220" rx="520" ry="200" fill="url(#textGlow)"/>

  <!-- ── Left bar chart silhouette ── -->
  <!-- 6 bars, varied heights, anchored to bottom area y=400 -->
  <g fill="url(#barGrad)">
    <rect x="60"  y="270" width="28" height="130"/>
    <rect x="100" y="300" width="28" height="100"/>
    <rect x="140" y="230" width="28" height="170"/>
    <rect x="180" y="310" width="28" height="90"/>
    <rect x="220" y="250" width="28" height="150"/>
    <rect x="260" y="285" width="28" height="115"/>
  </g>
  <!-- Bar top highlight lines -->
  <g stroke="#4D9FFF" stroke-width="1" opacity="0.18">
    <line x1="60"  y1="270" x2="88"  y2="270"/>
    <line x1="100" y1="300" x2="128" y2="300"/>
    <line x1="140" y1="230" x2="168" y2="230"/>
    <line x1="180" y1="310" x2="208" y2="310"/>
    <line x1="220" y1="250" x2="248" y2="250"/>
    <line x1="260" y1="285" x2="288" y2="285"/>
  </g>

  <!-- ── Right side grid/table suggestion ── -->
  <g opacity="0.5">
    <rect x="1580" y="120" width="280" height="240" fill="url(#gridLines)"/>
    <!-- Column separator lines -->
    <line x1="1672" y1="120" x2="1672" y2="360" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="1764" y1="120" x2="1764" y2="360" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <!-- Row separator lines -->
    <line x1="1580" y1="160" x2="1860" y2="160" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="1580" y1="200" x2="1860" y2="200" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="1580" y1="240" x2="1860" y2="240" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="1580" y1="280" x2="1860" y2="280" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="1580" y1="320" x2="1860" y2="320" stroke="#4D9FFF" stroke-width="0.5" opacity="0.12"/>
    <!-- Outer border -->
    <rect x="1580" y="120" width="280" height="240" fill="none" stroke="#4D9FFF" stroke-width="0.6" opacity="0.14" rx="2"/>
    <!-- Small data blips in cells -->
    <rect x="1590" y="130" width="40" height="4" rx="2" fill="#4D9FFF" opacity="0.14"/>
    <rect x="1590" y="170" width="55" height="4" rx="2" fill="#4D9FFF" opacity="0.10"/>
    <rect x="1590" y="210" width="30" height="4" rx="2" fill="#00FF9D" opacity="0.12"/>
    <rect x="1590" y="250" width="48" height="4" rx="2" fill="#4D9FFF" opacity="0.10"/>
    <rect x="1590" y="290" width="35" height="4" rx="2" fill="#4D9FFF" opacity="0.12"/>
    <rect x="1590" y="330" width="52" height="4" rx="2" fill="#00FF9D" opacity="0.10"/>
    <rect x="1682" y="130" width="30" height="4" rx="2" fill="#00D4FF" opacity="0.12"/>
    <rect x="1682" y="170" width="22" height="4" rx="2" fill="#4D9FFF" opacity="0.10"/>
    <rect x="1682" y="210" width="38" height="4" rx="2" fill="#4D9FFF" opacity="0.10"/>
    <rect x="1682" y="250" width="18" height="4" rx="2" fill="#00D4FF" opacity="0.12"/>
    <rect x="1682" y="290" width="44" height="4" rx="2" fill="#4D9FFF" opacity="0.10"/>
    <rect x="1682" y="330" width="26" height="4" rx="2" fill="#4D9FFF" opacity="0.10"/>
  </g>

  <!-- ── Diagonal glow lines ── -->
  <g filter="url(#glowLine)">
    <!-- Line 1: starts bottom-left, rises to upper-right -->
    <line x1="-20" y1="520" x2="1100" y2="-40"
          stroke="url(#diagLine1Grad)" stroke-width="1.5" opacity="0.5"/>
    <!-- Line 2: offset, wider sweep -->
    <line x1="100" y1="560" x2="1400" y2="-20"
          stroke="url(#diagLine2Grad)" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ── Sine/market-wave line ── -->
  <!-- A multi-segment sine approximation across the full width -->
  <path
    d="M0,260
       C40,255 80,235 120,240
       C160,245 200,270 240,265
       C280,260 320,240 360,245
       C400,250 440,275 480,268
       C520,261 560,238 600,243
       C640,248 680,272 720,265
       C760,258 800,237 840,244
       C880,251 920,274 960,267
       C1000,260 1040,236 1080,243
       C1120,250 1160,273 1200,265
       C1240,257 1280,236 1320,243
       C1360,250 1400,274 1440,266
       C1480,258 1520,237 1560,244
       C1600,251 1640,273 1680,265
       C1720,257 1760,238 1800,244
       C1840,250 1880,268 1920,262"
    fill="none"
    stroke="#00D4FF"
    stroke-width="1"
    opacity="0.15"
    clip-path="url(#waveClip)"/>

  <!-- ── Top accent line ── -->
  <rect x="0" y="0" width="1920" height="2" fill="url(#topLineGrad)"/>

  <!-- ── Bottom accent line ── -->
  <rect x="0" y="478" width="1920" height="2" fill="url(#bottomLineGrad)"/>

  <!-- ── Center title block ── -->
  <!-- Glow layer behind title -->
  <text
    x="960" y="240"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="800"
    letter-spacing="-4"
    fill="#00D4FF"
    opacity="0.12"
    filter="url(#glowText)">ET-SPOTTER</text>

  <!-- Main title -->
  <text
    x="960" y="240"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="800"
    letter-spacing="-4"
    fill="#E8F0FF">ET-SPOTTER</text>

  <!-- Subtitle tagline -->
  <text
    x="960" y="282"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="7"
    fill="#7C83FD">QUANTITATIVE ETF ANALYSIS · AUTOMATED · OPEN SOURCE</text>

  <!-- Thin rule below subtitle -->
  <line x1="760" y1="300" x2="1160" y2="300" stroke="#7C83FD" stroke-width="0.5" opacity="0.35"/>

  <!-- ── Bottom metadata strip ── -->
  <text
    x="960" y="460"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="3"
    fill="#1E3A5F">97 ETFs UCITS · GITHUB ACTIONS · YFINANCE · PYTHON · MIT LICENSE</text>

</svg>
