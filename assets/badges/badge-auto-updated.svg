<svg xmlns="http://www.w3.org/2000/svg" width="210" height="28" viewBox="0 0 210 28" fill="none">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="pill">
      <rect width="210" height="28" rx="6"/>
    </clipPath>
  </defs>

  <!-- Outer border -->
  <rect width="210" height="28" rx="6" fill="none" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Left section (label) -->
  <rect x="0" y="0" width="90" height="28" rx="0" fill="#0F1629" clip-path="url(#pill)"/>
  <rect x="0" y="0" width="96" height="28" fill="#0F1629"/>

  <!-- Right section (value) -->
  <rect x="90" y="0" width="120" height="28" fill="#0A1F35" clip-path="url(#pill)"/>

  <!-- Separator line -->
  <line x1="90" y1="4" x2="90" y2="24" stroke="#00D4FF" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Left label text -->
  <text x="46" y="18" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#8BA4C8" text-anchor="middle" dominant-baseline="auto">&#8635; PIPELINE</text>

  <!-- Right value text with glow -->
  <text x="150" y="18" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00D4FF" text-anchor="middle" dominant-baseline="auto" filter="url(#glow-cyan)">AUTO-UPDATED</text>
</svg>
