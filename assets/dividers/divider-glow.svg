<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 30" width="800" height="30">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0F1A" stop-opacity="1"/>
      <stop offset="25%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7C83FD" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A0F1A" stop-opacity="1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Glow layer -->
  <line x1="100" y1="15" x2="700" y2="15" stroke="#00D4FF" stroke-width="6" opacity="0.3" filter="url(#blur)"/>
  <!-- Sharp line -->
  <line x1="0" y1="15" x2="800" y2="15" stroke="url(#glow)" stroke-width="1.5"/>
  <!-- Center diamond -->
  <polygon points="400,10 405,15 400,20 395,15" fill="#7C83FD"/>
  <polygon points="400,11 404,15 400,19 396,15" fill="#0F1629"/>
</svg>
