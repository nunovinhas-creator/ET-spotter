<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bm_fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c83fd" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#7c83fd" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#7c83fd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c83fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bm_rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Pure black background -->
  <rect width="1280" height="360" fill="#000000"/>

  <!-- Top accent line (purple) -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#bm_fade)"/>

  <!-- Very subtle vertical rhythm: two thin marks flanking the title zone -->
  <line x1="140" y1="90" x2="140" y2="270" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="1140" y1="90" x2="1140" y2="270" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- Main title -->
  <text x="640" y="208"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="118" font-weight="800" fill="#ffffff" text-anchor="middle"
    letter-spacing="-5">ET-SPOTTER</text>

  <!-- Subtitle tagline -->
  <text x="640" y="252"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
    font-size="13" font-weight="400" fill="#7c83fd" text-anchor="middle"
    letter-spacing="8">QUANTITATIVE ETF ANALYSIS · AUTOMATED · OPEN SOURCE</text>

  <!-- Thin rule -->
  <rect x="0" y="290" width="1280" height="1" fill="url(#bm_rule)"/>

  <!-- Bottom metadata line -->
  <text x="640" y="318"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
    font-size="10" font-weight="400" fill="#222222" text-anchor="middle"
    letter-spacing="3">97 ETFs UCITS · GITHUB ACTIONS · YFINANCE · MIT LICENSE</text>
</svg>
