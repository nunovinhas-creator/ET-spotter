<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-left: full square -->
    <rect x="4" y="4" width="11" height="11" rx="2"/>
    <!-- Top-right: full square -->
    <rect x="17" y="4" width="11" height="11" rx="2"/>
    <!-- Bottom-left: wider rectangle -->
    <rect x="4" y="17" width="11" height="11" rx="2"/>
    <!-- Bottom-right: smaller square -->
    <rect x="17" y="17" width="11" height="11" rx="2"/>
  </g>
</svg>
