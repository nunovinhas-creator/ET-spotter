<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Circular gauge arc: 240 degrees, centered at 16,18, radius 11 -->
    <!-- 240 deg arc from 150deg to 30deg (clockwise), i.e. start bottom-left to bottom-right -->
    <!-- Start: 150deg = (16 + 11*cos(150), 18 + 11*sin(150)) = (16-9.526, 18+5.5) = (6.474, 23.5) -->
    <!-- End:   30deg  = (16 + 11*cos(30),  18 + 11*sin(30))  = (16+9.526, 18+5.5) = (25.526, 23.5) -->
    <path d="M 6.47 23.5 A 11 11 0 1 1 25.53 23.5" stroke-linecap="round"/>
    <!-- Tick marks: left (150deg), top (270deg), right (30deg) -->
    <!-- Left tick at 150deg: inner r=9, outer r=11 -->
    <line x1="7.21" y1="12.5" x2="8.94" y2="15.5"/>
    <!-- Top tick at 270deg (top): inner r=9 -> (16,9), outer r=11 -> (16,7) -->
    <line x1="16" y1="7" x2="16" y2="9.5"/>
    <!-- Right tick at 30deg -->
    <line x1="24.79" y1="12.5" x2="23.06" y2="15.5"/>
    <!-- Needle pointer: from center 16,18 pointing toward ~60deg (upper right) -->
    <line x1="16" y1="18" x2="22" y2="10"/>
    <!-- Center pivot dot -->
    <circle cx="16" cy="18" r="1.5" fill="#00D4FF"/>
    <!-- Number display area: small rounded rect at bottom center -->
    <rect x="11" y="22" width="10" height="5" rx="1.5"/>
  </g>
</svg>
