<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Bullish candlestick (left): tall body, color #00FF9D -->
  <g filter="url(#glow)">
    <!-- Wick top -->
    <line x1="8" y1="4" x2="8" y2="8" stroke="#00FF9D" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Body: tall bullish (close > open, bottom is open) -->
    <rect x="5" y="8" width="6" height="12" rx="1" fill="#00FF9D" stroke="#00FF9D" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Wick bottom -->
    <line x1="8" y1="20" x2="8" y2="26" stroke="#00FF9D" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Bearish candlestick (center): short body, color #FF4466 -->
  <g filter="url(#glow)">
    <!-- Wick top -->
    <line x1="16" y1="6" x2="16" y2="11" stroke="#FF4466" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Body: short bearish -->
    <rect x="13" y="11" width="6" height="7" rx="1" fill="#FF4466" stroke="#FF4466" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Wick bottom -->
    <line x1="16" y1="18" x2="16" y2="27" stroke="#FF4466" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Neutral candlestick (right): medium body, color #4D9FFF -->
  <g filter="url(#glow)">
    <!-- Wick top -->
    <line x1="24" y1="5" x2="24" y2="9" stroke="#4D9FFF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Body: medium neutral -->
    <rect x="21" y="9" width="6" height="10" rx="1" fill="#4D9FFF" stroke="#4D9FFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Wick bottom -->
    <line x1="24" y1="19" x2="24" y2="27" stroke="#4D9FFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
