<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160">
  <rect width="560" height="160" rx="10" fill="#0A0F1A" stroke="#1E2D4D" stroke-width="1"/>
  <text x="280" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#8BA4C8" text-anchor="middle" letter-spacing="2">ET-SPOTTER DESIGN SYSTEM</text>

  <!-- Swatch row 1: Backgrounds & Surfaces -->
  <!-- #0A0F1A -->
  <rect x="20" y="36" width="60" height="40" rx="4" fill="#0A0F1A" stroke="#1E2D4D" stroke-width="1"/>
  <text x="50" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#0A0F1A</text>
  <text x="50" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Background</text>

  <!-- #0F1629 -->
  <rect x="90" y="36" width="60" height="40" rx="4" fill="#0F1629" stroke="#1E2D4D" stroke-width="1"/>
  <text x="120" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#0F1629</text>
  <text x="120" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Surface</text>

  <!-- #141E35 -->
  <rect x="160" y="36" width="60" height="40" rx="4" fill="#141E35" stroke="#1E2D4D" stroke-width="1"/>
  <text x="190" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#141E35</text>
  <text x="190" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Elevated</text>

  <!-- #1E2D4D -->
  <rect x="230" y="36" width="60" height="40" rx="4" fill="#1E2D4D" stroke="#2A3D5E" stroke-width="1"/>
  <text x="260" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#1E2D4D</text>
  <text x="260" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Border</text>

  <!-- Swatch row 2: Accent colors -->
  <!-- #00D4FF -->
  <rect x="20" y="110" width="60" height="30" rx="4" fill="#00D4FF"/>
  <text x="50" y="152" font-family="monospace,sans-serif" font-size="8" fill="#8BA4C8" text-anchor="middle">#00D4FF</text>
  <text x="50" y="162" font-family="sans-serif" font-size="7" fill="#8BA4C8" text-anchor="middle">Cyan</text>

  <!-- #4D9FFF -->
  <rect x="90" y="110" width="60" height="30" rx="4" fill="#4D9FFF"/>
  <text x="120" y="152" font-family="monospace,sans-serif" font-size="8" fill="#8BA4C8" text-anchor="middle">#4D9FFF</text>
  <text x="120" y="162" font-family="sans-serif" font-size="7" fill="#8BA4C8" text-anchor="middle">Blue</text>

  <!-- #7C83FD -->
  <rect x="160" y="110" width="60" height="30" rx="4" fill="#7C83FD"/>
  <text x="190" y="152" font-family="monospace,sans-serif" font-size="8" fill="#8BA4C8" text-anchor="middle">#7C83FD</text>
  <text x="190" y="162" font-family="sans-serif" font-size="7" fill="#8BA4C8" text-anchor="middle">Purple</text>

  <!-- #00FF9D -->
  <rect x="230" y="110" width="60" height="30" rx="4" fill="#00FF9D"/>
  <text x="260" y="152" font-family="monospace,sans-serif" font-size="8" fill="#8BA4C8" text-anchor="middle">#00FF9D</text>
  <text x="260" y="162" font-family="sans-serif" font-size="7" fill="#8BA4C8" text-anchor="middle">Green</text>

  <!-- #FFB800 -->
  <rect x="300" y="110" width="60" height="30" rx="4" fill="#FFB800"/>
  <text x="330" y="152" font-family="monospace,sans-serif" font-size="8" fill="#8BA4C8" text-anchor="middle">#FFB800</text>
  <text x="330" y="162" font-family="sans-serif" font-size="7" fill="#8BA4C8" text-anchor="middle">Yellow</text>

  <!-- #FF4466 -->
  <rect x="370" y="110" width="60" height="30" rx="4" fill="#FF4466"/>
  <text x="400" y="152" font-family="monospace,sans-serif" font-size="8" fill="#8BA4C8" text-anchor="middle">#FF4466</text>
  <text x="400" y="162" font-family="sans-serif" font-size="7" fill="#8BA4C8" text-anchor="middle">Red</text>

  <!-- Text colors -->
  <!-- #E8F0FF -->
  <rect x="300" y="36" width="60" height="40" rx="4" fill="#141E35" stroke="#1E2D4D" stroke-width="1"/>
  <text x="330" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#E8F0FF" text-anchor="middle">Aa</text>
  <text x="330" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#E8F0FF</text>
  <text x="330" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Text Primary</text>

  <!-- #8BA4C8 -->
  <rect x="370" y="36" width="60" height="40" rx="4" fill="#141E35" stroke="#1E2D4D" stroke-width="1"/>
  <text x="400" y="60" font-family="sans-serif" font-size="13" fill="#8BA4C8" text-anchor="middle">Aa</text>
  <text x="400" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#8BA4C8</text>
  <text x="400" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Secondary</text>

  <!-- #4A6080 -->
  <rect x="440" y="36" width="60" height="40" rx="4" fill="#141E35" stroke="#1E2D4D" stroke-width="1"/>
  <text x="470" y="60" font-family="sans-serif" font-size="13" fill="#4A6080" text-anchor="middle">Aa</text>
  <text x="470" y="88" font-family="monospace,sans-serif" font-size="8" fill="#4A6080" text-anchor="middle">#4A6080</text>
  <text x="470" y="98" font-family="sans-serif" font-size="7" fill="#4A6080" text-anchor="middle">Muted</text>

  <!-- Top accent -->
  <line x1="0" y1="0" x2="560" y2="0" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>
</svg>
