<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#141626"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#7c83fd" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7c83fd" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#7c83fd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c83fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#7c83fd" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7c83fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c83fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c83fd" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7c83fd" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g fill="#7c83fd" opacity="0.05">
    <circle cx="160" cy="90"  r="1.5"/> <circle cx="320" cy="90"  r="1.5"/>
    <circle cx="480" cy="90"  r="1.5"/> <circle cx="640" cy="90"  r="1.5"/>
    <circle cx="800" cy="90"  r="1.5"/> <circle cx="960" cy="90"  r="1.5"/>
    <circle cx="1120" cy="90" r="1.5"/>
    <circle cx="160" cy="180" r="1.5"/> <circle cx="320" cy="180" r="1.5"/>
    <circle cx="480" cy="180" r="1.5"/> <circle cx="640" cy="180" r="1.5"/>
    <circle cx="800" cy="180" r="1.5"/> <circle cx="960" cy="180" r="1.5"/>
    <circle cx="1120" cy="180" r="1.5"/>
    <circle cx="160" cy="270" r="1.5"/> <circle cx="320" cy="270" r="1.5"/>
    <circle cx="480" cy="270" r="1.5"/> <circle cx="640" cy="270" r="1.5"/>
    <circle cx="800" cy="270" r="1.5"/> <circle cx="960" cy="270" r="1.5"/>
    <circle cx="1120" cy="270" r="1.5"/>
  </g>

  <!-- Rising price chart (main line) -->
  <polyline
    points="0,340 140,315 280,330 420,282 560,268 700,232 840,210 980,178 1120,148 1280,115"
    fill="none" stroke="#7c83fd" stroke-width="2.5" opacity="0.22"/>
  <!-- Secondary line -->
  <polyline
    points="0,350 140,332 280,344 420,308 560,298 700,268 840,252 980,228 1120,204 1280,176"
    fill="none" stroke="#4caf50" stroke-width="1.5" opacity="0.13"/>

  <!-- Chart data points -->
  <circle cx="560" cy="268" r="4.5" fill="#7c83fd" opacity="0.55"/>
  <circle cx="840" cy="210" r="4.5" fill="#7c83fd" opacity="0.55"/>
  <circle cx="1120" cy="148" r="5.5" fill="#4caf50" opacity="0.75"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#topLine)"/>

  <!-- Radar / signal icon (left side decoration) -->
  <g transform="translate(155,160)" opacity="0.28">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#7c83fd" stroke-width="1"/>
    <circle cx="0" cy="0" r="37" fill="none" stroke="#7c83fd" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#7c83fd" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="5"  fill="#7c83fd"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#7c83fd" stroke-width="0.5"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#7c83fd" stroke-width="0.5"/>
    <!-- Signal sweep line -->
    <line x1="0" y1="0" x2="44" y2="-30" stroke="#4caf50" stroke-width="2" opacity="0.9"/>
    <circle cx="44" cy="-30" r="3" fill="#4caf50" opacity="0.9"/>
  </g>

  <!-- Main title -->
  <text x="672" y="148"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="90" font-weight="800" fill="#ffffff" text-anchor="middle"
    letter-spacing="-4">ET-Spotter</text>

  <!-- Subtitle -->
  <text x="672" y="192"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="17" font-weight="400" fill="#7c83fd" text-anchor="middle"
    letter-spacing="5">QUANTITATIVE ETF ANALYSIS · AUTOMATED · OPEN SOURCE</text>

  <!-- Stats divider line -->
  <rect x="192" y="218" width="896" height="1" fill="url(#divider)"/>

  <!-- Stat: 97 ETFs -->
  <text x="256"  y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700"
    fill="#4caf50" text-anchor="middle">97</text>
  <text x="256"  y="294" font-family="Arial, sans-serif" font-size="11" fill="#555"
    text-anchor="middle" letter-spacing="2">ETFs UCITS</text>

  <line x1="384"  y1="235" x2="384"  y2="305" stroke="#1e2130" stroke-width="1"/>

  <!-- Stat: 4 Factors -->
  <text x="480"  y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700"
    fill="#7c83fd" text-anchor="middle">4</text>
  <text x="480"  y="294" font-family="Arial, sans-serif" font-size="11" fill="#555"
    text-anchor="middle" letter-spacing="2">FACTORES</text>

  <line x1="576"  y1="235" x2="576"  y2="305" stroke="#1e2130" stroke-width="1"/>

  <!-- Stat: Daily 22h -->
  <text x="672"  y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700"
    fill="#ffd54f" text-anchor="middle">22h</text>
  <text x="672"  y="294" font-family="Arial, sans-serif" font-size="11" fill="#555"
    text-anchor="middle" letter-spacing="2">DIÁRIO</text>

  <line x1="768"  y1="235" x2="768"  y2="305" stroke="#1e2130" stroke-width="1"/>

  <!-- Stat: €0 -->
  <text x="864"  y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700"
    fill="#4caf50" text-anchor="middle">€0</text>
  <text x="864"  y="294" font-family="Arial, sans-serif" font-size="11" fill="#555"
    text-anchor="middle" letter-spacing="2">CUSTO</text>

  <line x1="960"  y1="235" x2="960"  y2="305" stroke="#1e2130" stroke-width="1"/>

  <!-- Stat: ~3min -->
  <text x="1056" y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700"
    fill="#aaaaff" text-anchor="middle">~3min</text>
  <text x="1056" y="294" font-family="Arial, sans-serif" font-size="11" fill="#555"
    text-anchor="middle" letter-spacing="2">PIPELINE</text>

  <!-- Bottom gradient decoration -->
  <rect x="0" y="320" width="1280" height="40" fill="url(#bottomFade)"/>
</svg>
